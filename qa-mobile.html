<!doctype html><html lang="ru"><meta charset="utf-8"><title>Yupland Heroes — проверка экрана</title><style>body{margin:0;background:#333;display:grid;place-items:center;min-height:100vh}iframe{width:360px;height:740px;border:0;background:#14130f;display:block}</style><iframe src="/" title="Проверка размера игрового экрана"></iframe><script>const q=new URLSearchParams(location.search),f=document.querySelector('iframe');f.style.width=Math.max(280,Math.min(1280,Number(q.get('w'))||360))+'px';f.style.height=Math.max(280,Math.min(1280,Number(q.get('h'))||740))+'px';</script></html>
